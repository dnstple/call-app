<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" width="1080" height="470" role="img" aria-label="Two young friends having a friendly video conversation">
  <defs>
    <clipPath id="cL"><circle cx="330" cy="235" r="150"/></clipPath>
    <clipPath id="cR"><circle cx="750" cy="235" r="150"/></clipPath>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="1080" height="470" rx="28" fill="#FBE9DE"/>

  <!-- connection waves -->
  <g fill="none" stroke="#F2A272" stroke-width="6" stroke-linecap="round" opacity="0.75">
    <path d="M472 118 q20 -22 40 0"/>
    <path d="M454 128 q38 -42 76 0"/>
    <path d="M608 118 q-20 -22 -40 0"/>
    <path d="M626 128 q-38 -42 -76 0"/>
  </g>

  <!-- sparkles -->
  <g fill="#C8643D">
    <path d="M172 118 l7 16 16 7 -16 7 -7 16 -7 -16 -16 -7 16 -7z"/>
    <path d="M908 305 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6z"/>
    <path d="M540 58 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z" opacity="0.85"/>
  </g>

  <!-- ===== LEFT: young man (kept), apricot ===== -->
  <circle cx="330" cy="235" r="150" fill="#FCEBDD"/>
  <g clip-path="url(#cL)">
    <rect x="176" y="356" width="308" height="170" rx="74" fill="#F2A272"/>
    <path d="M292 372 q38 26 76 0 l0 -70 -76 0z" fill="#FBDCC6"/>
    <rect x="300" y="300" width="60" height="66" rx="24" fill="#E0A579"/>
    <circle cx="330" cy="250" r="74" fill="#E8B48C"/>
    <!-- hair -->
    <path d="M254 250 q4 -92 76 -92 q72 0 76 92 q-20 -40 -40 -46 q-2 20 -36 20 q-34 0 -36 -20 q-20 6 -40 46z" fill="#33261F"/>
    <!-- brows + eyes + smile -->
    <circle cx="306" cy="252" r="6.5" fill="#201C19"/>
    <circle cx="354" cy="252" r="6.5" fill="#201C19"/>
    <path d="M312 280 q18 16 36 0" fill="none" stroke="#201C19" stroke-width="6" stroke-linecap="round"/>
    <circle cx="296" cy="266" r="9" fill="#F0A98A" opacity="0.5"/>
    <circle cx="364" cy="266" r="9" fill="#F0A98A" opacity="0.5"/>
    <!-- headphones -->
    <path d="M254 250 a76 76 0 0 1 152 0" fill="none" stroke="#C8643D" stroke-width="13" stroke-linecap="round"/>
    <rect x="244" y="236" width="28" height="50" rx="13" fill="#C8643D"/>
    <rect x="388" y="236" width="28" height="50" rx="13" fill="#C8643D"/>
  </g>
  <circle cx="330" cy="235" r="150" fill="none" stroke="#F2A272" stroke-width="8"/>

  <!-- heart link -->
  <circle cx="540" cy="235" r="46" fill="#FCFAF7" stroke="#F2A272" stroke-width="5"/>
  <path d="M540 258 c-22 -16 -34 -30 -34 -44 c0 -12 9 -20 20 -20 c8 0 12 5 14 9 c2 -4 6 -9 14 -9 c11 0 20 8 20 20 c0 14 -12 28 -34 44z" fill="#C8643D"/>

  <!-- ===== RIGHT: young woman (now young), sage ===== -->
  <circle cx="750" cy="235" r="150" fill="#E7EFE7"/>
  <g clip-path="url(#cR)">
    <rect x="596" y="356" width="308" height="170" rx="74" fill="#8FB39A"/>
    <path d="M712 372 q38 24 76 0 l0 -70 -76 0z" fill="#EAF1EA"/>
    <rect x="720" y="300" width="60" height="66" rx="24" fill="#DBA079"/>
    <circle cx="750" cy="250" r="74" fill="#EAB284"/>
    <!-- long hair behind + on top (young, shoulder-length auburn) -->
    <path d="M666 250 q0 -96 84 -96 q84 0 84 96 l0 120 -30 0 0 -110 q-6 -34 -54 -34 q-48 0 -54 34 l0 110 -30 0z" fill="#6B3B2A"/>
    <path d="M674 250 q4 -84 76 -84 q72 0 76 84 q-20 -36 -40 -42 q-2 18 -36 18 q-34 0 -36 -18 q-20 6 -40 42z" fill="#7A4531"/>
    <!-- eyes + smile -->
    <circle cx="726" cy="252" r="6.5" fill="#201C19"/>
    <circle cx="774" cy="252" r="6.5" fill="#201C19"/>
    <path d="M732 280 q18 16 36 0" fill="none" stroke="#201C19" stroke-width="6" stroke-linecap="round"/>
    <circle cx="716" cy="266" r="9" fill="#E79A78" opacity="0.5"/>
    <circle cx="784" cy="266" r="9" fill="#E79A78" opacity="0.5"/>
    <!-- headphones -->
    <path d="M674 250 a76 76 0 0 1 152 0" fill="none" stroke="#3E5A46" stroke-width="13" stroke-linecap="round"/>
    <rect x="664" y="236" width="28" height="50" rx="13" fill="#3E5A46"/>
    <rect x="808" y="236" width="28" height="50" rx="13" fill="#3E5A46"/>
  </g>
  <circle cx="750" cy="235" r="150" fill="none" stroke="#8FB39A" stroke-width="8"/>
</svg>
