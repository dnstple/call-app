<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" width="1080" height="470" role="img" aria-label="Two friends having a friendly video conversation">
  <defs>
    <clipPath id="cL"><circle cx="330" cy="235" r="150"/></clipPath>
    <clipPath id="cR"><circle cx="750" cy="235" r="150"/></clipPath>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="1080" height="470" rx="28" fill="#FBE9DE"/>

  <!-- connection waves -->
  <g fill="none" stroke="#F2A272" stroke-width="6" stroke-linecap="round" opacity="0.7">
    <path d="M470 120 q20 -22 40 0"/>
    <path d="M452 130 q38 -42 76 0"/>
    <path d="M610 120 q-20 -22 -40 0"/>
    <path d="M628 130 q-38 -42 -76 0"/>
  </g>

  <!-- sparkles -->
  <g fill="#C8643D">
    <path d="M175 120 l7 16 16 7 -16 7 -7 16 -7 -16 -16 -7 16 -7z"/>
    <path d="M905 300 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6z"/>
    <path d="M540 60 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z" opacity="0.8"/>
  </g>

  <!-- LEFT person (young, apricot) -->
  <circle cx="330" cy="235" r="150" fill="#FCEBDD"/>
  <g clip-path="url(#cL)">
    <rect x="180" y="360" width="300" height="160" rx="70" fill="#F2A272"/>
    <rect x="300" y="300" width="60" height="70" rx="24" fill="#E0A579"/>
    <circle cx="330" cy="250" r="72" fill="#E8B48C"/>
    <!-- hair -->
    <path d="M258 246 q0 -84 72 -84 q72 0 72 84 q-18 -34 -72 -34 q-54 0 -72 34z" fill="#3A2A22"/>
    <!-- face -->
    <circle cx="308" cy="250" r="6.5" fill="#201C19"/>
    <circle cx="352" cy="250" r="6.5" fill="#201C19"/>
    <path d="M312 276 q18 16 36 0" fill="none" stroke="#201C19" stroke-width="6" stroke-linecap="round"/>
    <!-- headphones -->
    <path d="M256 250 a74 74 0 0 1 148 0" fill="none" stroke="#C8643D" stroke-width="12" stroke-linecap="round"/>
    <rect x="246" y="238" width="26" height="46" rx="12" fill="#C8643D"/>
    <rect x="388" y="238" width="26" height="46" rx="12" fill="#C8643D"/>
  </g>
  <circle cx="330" cy="235" r="150" fill="none" stroke="#F2A272" stroke-width="8"/>

  <!-- heart link -->
  <circle cx="540" cy="235" r="46" fill="#FCFAF7" stroke="#F2A272" stroke-width="5"/>
  <path d="M540 258 c-22 -16 -34 -30 -34 -44 c0 -12 9 -20 20 -20 c8 0 12 5 14 9 c2 -4 6 -9 14 -9 c11 0 20 8 20 20 c0 14 -12 28 -34 44z" fill="#C8643D"/>

  <!-- RIGHT person (young, sage) -->
  <circle cx="750" cy="235" r="150" fill="#E7EFE7"/>
  <g clip-path="url(#cR)">
    <rect x="600" y="360" width="300" height="160" rx="70" fill="#9CB4A0"/>
    <rect x="720" y="300" width="60" height="70" rx="24" fill="#D8A57C"/>
    <circle cx="750" cy="250" r="72" fill="#E3AC80"/>
    <!-- hair (bun) -->
    <path d="M678 250 q0 -88 72 -88 q72 0 72 88 q-16 -30 -46 -37 l0 -18 q-26 -8 -52 0 l0 18 q-30 7 -46 37z" fill="#2C2622"/>
    <circle cx="750" cy="150" r="20" fill="#2C2622"/>
    <!-- face -->
    <circle cx="728" cy="252" r="6.5" fill="#201C19"/>
    <circle cx="772" cy="252" r="6.5" fill="#201C19"/>
    <path d="M732 278 q18 16 36 0" fill="none" stroke="#201C19" stroke-width="6" stroke-linecap="round"/>
    <!-- headphones -->
    <path d="M676 252 a74 74 0 0 1 148 0" fill="none" stroke="#3E5A46" stroke-width="12" stroke-linecap="round"/>
    <rect x="666" y="240" width="26" height="46" rx="12" fill="#3E5A46"/>
    <rect x="808" y="240" width="26" height="46" rx="12" fill="#3E5A46"/>
  </g>
  <circle cx="750" cy="235" r="150" fill="none" stroke="#9CB4A0" stroke-width="8"/>
</svg>
